# Cloudflare Tunnel (test mode, docker-compose.tunnel.yml).
# Every hostname routed to this tunnel (k-javon.uz, *.k-javon.uz) goes to Caddy,
# which picks the right service by Host header.
tunnel: e90ef58a-2a99-475c-b3c2-e31406730ca0
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - service: http://caddy:80