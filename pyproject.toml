# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # modern syntax
    "N",            # naming
    "S",            # bandit (security)
    "ASYNC",        # blocking calls inside async code
    "DTZ",          # naive datetimes
    "SIM",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "RUF001"]  # fake tokens in tests are fine
"tests/conftest.py" = ["S101", "S105", "E402"]  # env vars must be set before app is imported
"translations.py" = ["RUF001", "E501"]  # message texts are prose
"services/telegram_texts.py" = ["RUF001", "E501"]  # chat messages are prose
"utils/translit.py" = ["RUF001", "RUF002", "RUF003"]  # Cyrillic and apostrophe tables on purpose
"services/excel.py" = ["RUF001", "RUF003"]  # Cyrillic header and language names on purpose
"alembic/versions/*" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default arguments on purpose.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.Header", "fastapi.Cookie", "fastapi.File", "fastapi.Form",
]

[tool.ruff.lint.isort]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs the PostgreSQL test database (TEST_DATABASE_URL, TEST_MIGRATION_DATABASE_URL)",
]
